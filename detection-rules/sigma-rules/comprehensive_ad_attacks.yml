# ===========================================================================
title: Golden Ticket Attack Detection - Forged TGT
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: Detects potential Golden Ticket attacks via anomalous TGT characteristics
references:
  - https://attack.mitre.org/techniques/T1558/001/
