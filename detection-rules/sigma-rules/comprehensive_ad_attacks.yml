# ===========================================================================
# LATERAL MOVEMENT DETECTION (T1570)
# ===========================================================================
title: Lateral Movement via WMI
id: 5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b
status: stable
description: Detects lateral movement using WMI command execution
references:
