# ===========================================================================
# PASS-THE-HASH DETECTION (T1550.002)
# ===========================================================================
title: Pass-the-Hash Attack Detection - NTLM Authentication
id: 8d5e9f0a-1b2c-3d4e-5f6a-7b8c9d0e1f2a
status: stable
description: Detects Pass-the-Hash attacks via NTLM authentication anomalies
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: Purple Team Lab
tags:
  - attack.lateral_movement
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624  # Successful logon
    LogonType: 3  # Network logon
    AuthenticationPackageName: 'NTLM'
  filter_normal:
    LogonProcessName: 'NtLmSsp'
  condition: selection and not filter_normal
level: medium

---
title: Pass-the-Hash - Logon from Unusual Source
id: 9e6f0a1b-2c3d-4e5f-6a7b-8c9d0e1f2a3b
status: stable
description: Detects Pass-the-Hash from non-standard workstation names
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    WorkstationName|re: '^(KALI|ATTACKER|PARROT).*'
level: high

