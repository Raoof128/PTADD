# ===========================================================================
# DCSYNC DETECTION (T1003.006)
# ===========================================================================
title: DCSync Attack Detection - Directory Replication
id: 0f1a2b3c-4d5e-6f7a-8b9c-0d1e2f3a4b5c
status: stable
description: Detects DCSync attacks via directory service replication requests
references:
  - https://attack.mitre.org/techniques/T1003/006/
  - https://adsecurity.org/?p=1729
author: Purple Team Lab
tags:
  - attack.credential_access
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662  # Directory Service Access
    AccessMask: '0x100'  # Control Access
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'  # DS-Replication-Get-Changes-All
      - '89e95b76-444d-4c62-991a-0facbeda640c'  # DS-Replication-Get-Changes-In-Filtered-Set
  filter_dc:
    SubjectUserName|endswith: '$'
    SubjectLogonId: '0x3e7'  # SYSTEM
  condition: selection and not filter_dc
level: critical

---
title: DCSync - From Non-DC System
id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
status: stable
description: Detects replication requests from non-Domain Controller systems
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    ObjectType: 'domainDNS'
  filter:
    SubjectUserName|endswith: 'DC$'
  condition: selection and not filter
level: critical

