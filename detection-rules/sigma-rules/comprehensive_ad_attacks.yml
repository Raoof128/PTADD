# ===========================================================================
# BLOODHOUND/AD ENUMERATION DETECTION (T1087.002)
# ===========================================================================
title: BloodHound/SharpHound Enumeration Detection
id: 0d1e2f3a-4b5c-6d7e-8f9a-0b1c2d3e4f5a
status: stable
description: Detects BloodHound/SharpHound Active Directory enumeration
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: Purple Team Lab
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_process:
    Image|endswith:
      - '\SharpHound.exe'
      - '\Bloodhound.exe'
  selection_cmdline:
    CommandLine|contains:
      - 'Invoke-BloodHound'
      - '-CollectionMethod All'
      - 'Get-DomainUser'
      - 'Get-DomainComputer'
  condition: selection_process or selection_cmdline
level: high

