# ===========================================================================
# AS-REP ROASTING DETECTION (T1558.004)
# ===========================================================================
title: AS-REP Roasting Attack Detection
id: 6b3c7d8e-9f0a-1b2c-3d4e-5f6a7b8c9d0e
status: stable
description: Detects AS-REP roasting attacks targeting accounts with Kerberos pre-authentication disabled
references:
  - https://attack.mitre.org/techniques/T1558/004/
author: Purple Team Lab
date: 2024/01/14
tags:
  - attack.credential_access
  - attack.t1558.004
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768  # Kerberos Authentication Ticket (TGT)
    Status: '0x0'  # Success
    PreAuthType: '0'  # No pre-authentication
  filter:
    TargetUserName|endswith: '$'  # Exclude computer accounts
  condition: selection and not filter
level: high

---
title: AS-REP Roasting - Multiple Requests
id: 7c4d8e9f-0a1b-2c3d-4e5f-6a7b8c9d0e1f
status: experimental
description: Detects multiple AS-REQ without pre-auth (automated tools)
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: '0'
  timeframe: 5m
  condition: selection | count(TargetUserName) by IpAddress > 3
level: high

