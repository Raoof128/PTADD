title: Group Policy Modification Detection
id: 9c0d1e2f-3a4b-5c6d-7e8f-9a0b1c2d3e4f
status: stable
description: Detects unauthorized Group Policy Object modifications
references:
  - https://attack.mitre.org/techniques/T1484/001/
author: Purple Team Lab
tags:
  - attack.privilege_escalation
  - attack.t1484.001
logsource:
  product: windows
