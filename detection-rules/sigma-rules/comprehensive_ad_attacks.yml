# ===========================================================================
# LSASS DUMPING DETECTION (T1003.001)
# ===========================================================================
title: LSASS Memory Dump Detection
id: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
status: stable
description: Detects LSASS process memory dumping for credential extraction
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Purple Team Lab
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1438'
  filter:
    SourceImage|endswith:
      - '\svchost.exe'
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'  # Windows Defender
  condition: selection and not filter
level: critical

---
title: LSASS Dump via Comsvcs.dll
id: 8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: stable
description: Detects LSASS dumping using comsvcs.dll (Living off the Land)
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'comsvcs.dll'
      - 'MiniDump'
  condition: selection
level: critical

