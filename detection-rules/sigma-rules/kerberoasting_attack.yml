title: Kerberoasting Attack Detection - Service Ticket Request Anomaly
id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
status: stable
description: |
  Detects anomalous Kerberos service ticket requests that may indicate Kerberoasting activity.
  This rule identifies service accounts being accessed by users who don't typically request
  tickets for those services, indicating potential reconnaissance or attack activity.

references:
  - https://attack.mitre.org/techniques/T1558/003/

author: Purple Team Lab
date: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4769
    Status: '0x0'

  # Service accounts with SPNs (high-value targets)
  selection_target:
    ServiceName|contains:
      - 'svc_'
      - 'service_'
      - 'admin_'
      - 'sql'
      - 'http'
      - 'ldap'

  # Unusual ticket options
  selection_options:
    TicketOptions:
      - '0x40810000'  # Forwardable, Renewable
      - '0x40800000'  # Forwardable

  filter_computers:
    TargetUserName|endswith: '$'

  condition: selection and selection_target and selection_options and not filter_computers

falsepositives:
  - Legitimate service access
  - Service discovery by administrators
  - Monitoring and inventory tools

level: medium

