title: Kerberoasting Attack Detection - Service Ticket Request
id: 8a1b3c4e-5f6a-7d8e-9f0a-1b2c3d4e5f6a
status: stable
description: |
  Detects potential Kerberoasting attacks by identifying suspicious Kerberos service ticket (TGS) requests.
  Kerberoasting is a post-exploitation attack technique that attempts to crack the password hashes of
  service accounts by requesting service tickets and performing offline password cracking.

  This rule identifies:
  - Multiple TGS requests in a short time period
  - TGS requests using RC4 encryption (weaker than AES, preferred by attackers)
  - TGS requests for service accounts with weak encryption
  - Unusual service ticket requests from non-service accounts

references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://adsecurity.org/?p=3458
  - https://www.harmj0y.net/blog/powershell/kerberoasting-without-mimikatz/
  - https://github.com/GhostPack/Rubeus

author: Purple Team Lab
date: 2024/01/14
modified: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003
  - attack.t1558
  - mitre.attack.credential_access

logsource:
  product: windows
  service: security
  definition: 'Requirements: Advanced Audit Policy must be enabled for Kerberos authentication events'

detection:
  # Event ID 4769: Kerberos Service Ticket Request
  selection_base:
    EventID: 4769
    Status: '0x0'  # Success
    ServiceName: '*$'  # Service accounts typically end with $

  # RC4 encryption (etype 0x17 = 23) - preferred by attackers
  selection_encryption_weak:
    TicketEncryptionType: '0x17'

  # Exclude machine accounts and common services
  filter_legitimate:
    ServiceName|endswith:
      - '$'  # Computer accounts
      - 'krbtgt'  # Kerberos Ticket Granting Ticket service
    TargetUserName|endswith: '$'  # Machine accounts

  # High-value service accounts (SQL, IIS, etc.)
  selection_high_value:
    ServiceName|contains:
      - 'MSSQLSvc'
      - 'HTTP'
      - 'www'
      - 'ldap'
      - 'ftp'
      - 'imap'
      - 'smtp'
      - 'exchange'

  condition: selection_base and selection_encryption_weak and not filter_legitimate

fields:
  - TargetUserName
  - ServiceName
  - IpAddress
  - TicketEncryptionType
  - TargetDomainName
  - Status

falsepositives:
  - Legitimate service account access by authorized users
  - Legitimate applications requesting service tickets with RC4 encryption
  - Service discovery and enumeration by system administrators
  - Automated monitoring tools accessing multiple services

level: high

