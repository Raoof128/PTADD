title: Kerberoasting Attack Detection - PowerShell Request Service Ticket
id: 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
status: experimental
description: |
  Detects PowerShell-based Kerberoasting using the System.IdentityModel.Tokens.KerberosRequestorSecurityToken
  class to request service tickets. This technique is commonly used by PowerShell-based Kerberoasting tools.

references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://www.harmj0y.net/blog/powershell/kerberoasting-without-mimikatz/

author: Purple Team Lab
date: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003
  - attack.execution
  - attack.t1059.001

logsource:
  product: windows
  category: process_creation

detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_kerberos_class:
    CommandLine|contains:
      - 'System.IdentityModel.Tokens.KerberosRequestorSecurityToken'
      - 'Add-Type -AssemblyName System.IdentityModel'
      - 'KerberosRequestorSecurityToken'
      - 'GetRequest()'

  condition: selection_powershell and selection_kerberos_class

falsepositives:
  - Legitimate PowerShell scripts for service authentication
  - Security testing and auditing by authorized personnel

level: high

