title: Kerberoasting Attack Detection - Impacket GetUserSPNs
id: 3c4d5e6f-7a8b-9c0d-1e2f-3a4b5c6d7e8f
status: stable
description: |
  Detects the use of Impacket's GetUserSPNs.py tool for Kerberoasting attacks from Linux systems.
  This tool is commonly used by penetration testers and attackers to enumerate and request
  service tickets for accounts with SPNs.

references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://github.com/fortra/impacket

author: Purple Team Lab
date: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003

logsource:
  product: windows
  service: security

detection:
  # Unusual source IPs requesting multiple service tickets
  selection:
    EventID: 4769
    Status: '0x0'
    TicketEncryptionType: '0x17'

  # Impacket often uses specific patterns
  selection_impacket:
    IpAddress|re: '^(?!.*172\.28\.0\.1[0-9]).*'  # Non-Windows endpoints

  filter:
    ServiceName|endswith:
      - '$'
      - 'krbtgt'

  timeframe: 2m
  condition: selection and selection_impacket and not filter | count(ServiceName) by IpAddress > 3

falsepositives:
  - Legitimate Linux systems authenticating to AD services
  - Authorized penetration testing
  - Security tools performing service enumeration

level: high

