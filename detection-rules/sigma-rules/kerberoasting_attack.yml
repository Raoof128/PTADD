title: Kerberoasting Attack Detection - Multiple Service Ticket Requests
id: 9b2c3d4e-6f7a-8d9e-0f1a-2b3c4d5e6f7a
status: experimental
description: |
  Detects potential Kerberoasting by identifying users requesting an unusually high number of
  Kerberos service tickets within a short time period. This is a behavioral detection that
  identifies mass service ticket requests characteristic of automated Kerberoasting tools.

references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://adsecurity.org/?p=3458

author: Purple Team Lab
date: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003

logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4769
    Status: '0x0'
    TicketEncryptionType: '0x17'  # RC4

  filter:
    ServiceName|endswith:
      - '$'
      - 'krbtgt'

  # Correlation: More than 5 unique service ticket requests within 5 minutes
  timeframe: 5m
  condition: selection and not filter | count(ServiceName) by TargetUserName > 5

falsepositives:
  - Service discovery scans
  - Automated system administration tools
  - Legitimate user accessing multiple services

level: high

