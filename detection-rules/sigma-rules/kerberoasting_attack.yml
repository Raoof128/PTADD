title: Kerberoasting Attack Detection - Credential Dumping via Service Tickets
id: 4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a
status: stable
description: |
  Detects potential credential dumping through Kerberoasting by correlating service ticket
  requests with subsequent suspicious activity such as lateral movement or privilege escalation.

references:
  - https://attack.mitre.org/techniques/T1558/003/

author: Purple Team Lab
date: 2024/01/14

tags:
  - attack.credential_access
  - attack.t1558.003
  - attack.lateral_movement

logsource:
  product: windows
  service: security

detection:
  # Stage 1: Service ticket request
  selection_stage1:
    EventID: 4769
    Status: '0x0'
    TicketEncryptionType: '0x17'

  # Stage 2: Subsequent authentication using cracked credentials
  selection_stage2:
    EventID:
      - 4624  # Successful logon
      - 4648  # Logon with explicit credentials

  # Correlation: Same source user, different target within 1 hour
  timeframe: 1h
  condition: selection_stage1 and selection_stage2

falsepositives:
  - Normal user behavior accessing multiple services
  - Legitimate administrative activity

level: medium

